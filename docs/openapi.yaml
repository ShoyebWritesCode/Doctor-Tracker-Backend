openapi: 3.1.0
info:
  title: Doctor Tracker API
  version: 1.0.0
  description: >-
    REST contract for the Doctor Tracker administrative demonstration. All records
    are fictional. Protected routes require an active administrator and a revocable
    opaque cookie (HttpOnly, Secure in production, SameSite=Lax, Path=/api/v1,
    no Domain). Mutations require the exact configured frontend Origin.
    Responses include X-Request-Id and Cache-Control private, no-store.
    API requests can return 429 (Retry-After), 500 (generic production error)
    or 503 (dependency unavailable), in the shared error envelope. JSON bodies
    are limited to 100 KB; unsupported media types return 415 and oversized bodies 413.
servers:
  - url: https://doctor-tracker-api-shoyeb.vercel.app
    description: Deployed Express API
  - url: http://localhost:4000
    description: Local Express server
  - url: /
    description: Same-origin frontend proxy
tags:
  - name: Operations
  - name: Authentication
  - name: Doctors
  - name: Patients
  - name: Dashboard
paths:
  /api-docs/openapi.json:
    get:
      tags: [Operations]
      summary: Read this OpenAPI document without an interactive explorer
      operationId: getOpenApi
      security: []
      responses:
        "200":
          description: OpenAPI 3.1 document, not a data-envelope response.
          content:
            application/json:
              schema:
                type: object
  /health:
    get:
      tags: [Operations]
      summary: Check process liveness
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      tags: [Operations]
      summary: Check application readiness
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: Application and database are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Create an administrator session
      operationId: login
      security: []
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated. Sets the opaque session cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly Doctor Tracker session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current session
      operationId: logout
      parameters:
        - $ref: "#/components/parameters/Origin"
      responses:
        "204":
          description: Session revoked and cookie cleared.
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      summary: Return the authenticated administrator
      operationId: getCurrentAdmin
      responses:
        "200":
          description: Current administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /api/v1/doctors:
    get:
      tags: [Doctors]
      summary: List doctors
      operationId: listDoctors
      description: >-
        Returns public doctor fields and pagination metadata. Unknown query keys,
        repeated parameters, invalid timestamps, and unsafe pagination offsets are rejected.
        Name ordering uses normalized names; every sort uses id in the same direction
        as a deterministic tiebreaker. Pages beyond the last page return an empty data array.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: search
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
          description: Case-insensitive literal prefix search across normalized name, email, and hospital. Regex metacharacters are escaped.
        - name: specialization
          in: query
          description: Exact match after Unicode, whitespace, and case normalization.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: hospital
          in: query
          description: Exact match after Unicode, whitespace, and case normalization.
          schema:
            type: string
            minLength: 1
            maxLength: 160
        - $ref: "#/components/parameters/CreatedFrom"
        - $ref: "#/components/parameters/CreatedTo"
        - name: sort
          in: query
          schema:
            $ref: "#/components/schemas/DoctorSort"
      responses:
        "200":
          description: Paginated doctors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorListResponse"
              example:
                data:
                  - id: "507f1f77bcf86cd799439011"
                    name: "Dr. Samira Khan"
                    specialization: "Cardiology"
                    hospital: "Central Hospital"
                    phone: "+880 1700 000001"
                    email: "samira@example.test"
                    patientCount: 0
                    createdAt: "2026-01-01T00:00:00.000Z"
                    updatedAt: "2026-01-01T00:00:00.000Z"
                meta: { page: 1, limit: 20, total: 1, totalPages: 1 }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
    post:
      tags: [Doctors]
      summary: Create a doctor
      operationId: createDoctor
      description: >-
        Requires an active administrator session and trusted Origin. Display fields
        are trimmed and retain casing. Email is trimmed, lowercased, and unique.
        patientCount is server-owned and starts at zero. Unknown body fields are rejected.
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDoctorInput"
            example:
              name: "Dr. Samira Khan"
              specialization: "Cardiology"
              hospital: "Central Hospital"
              phone: "+880 1700 000001"
              email: "samira@example.test"
      responses:
        "201":
          description: Doctor created.
          headers:
            Location:
              schema:
                type: string
              description: API path of the created doctor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorResponse"
              example:
                data:
                  id: "507f1f77bcf86cd799439011"
                  name: "Dr. Samira Khan"
                  specialization: "Cardiology"
                  hospital: "Central Hospital"
                  phone: "+880 1700 000001"
                  email: "samira@example.test"
                  patientCount: 0
                  createdAt: "2026-01-01T00:00:00.000Z"
                  updatedAt: "2026-01-01T00:00:00.000Z"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/doctors/{doctorId}:
    parameters:
      - $ref: "#/components/parameters/DoctorId"
    get:
      tags: [Doctors]
      summary: Get a doctor
      operationId: getDoctor
      description: Returns the public doctor DTO. Malformed IDs return 400; valid IDs without a matching record return DOCTOR_NOT_FOUND (404).
      responses:
        "200":
          description: Doctor details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorResponse"
              example:
                data:
                  id: "507f1f77bcf86cd799439011"
                  name: "Dr. Samira Khan"
                  specialization: "Cardiology"
                  hospital: "Central Hospital"
                  phone: "+880 1700 000001"
                  email: "samira@example.test"
                  patientCount: 0
                  createdAt: "2026-01-01T00:00:00.000Z"
                  updatedAt: "2026-01-01T00:00:00.000Z"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/doctors/{doctorId}/patients:
    parameters:
      - $ref: "#/components/parameters/DoctorId"
    get:
      tags: [Patients]
      summary: List patients assigned to a doctor
      operationId: listDoctorPatients
      description: >-
        Resolves the doctor before listing. Supports server-side search, exact
        condition/status filters, creation-date ranges, and stable pagination.
        A doctorId query override is rejected. Missing doctors return DOCTOR_NOT_FOUND.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PatientSearch"
        - $ref: "#/components/parameters/Condition"
        - $ref: "#/components/parameters/PatientStatus"
        - $ref: "#/components/parameters/CreatedFrom"
        - $ref: "#/components/parameters/CreatedTo"
        - $ref: "#/components/parameters/PatientSort"
      responses:
        "200":
          description: Paginated patients for the doctor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientListResponse"
              examples:
                patients:
                  $ref: "#/components/examples/PatientList"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Patients]
      summary: Create a patient assigned to a doctor
      operationId: createDoctorPatient
      description: >-
        Creates the patient and increments the doctor's patientCount in one
        transaction. Requires at least one contact method. The route determines
        the immutable doctor association; unknown body fields are rejected.
        A transaction-capable MongoDB replica set is required.
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePatientInput"
            example:
              name: "Fictional Samira"
              email: "samira@example.test"
              condition: "Routine review"
              status: active
              dateOfBirth: "2000-02-29"
      responses:
        "201":
          description: Patient created.
          headers:
            Location:
              schema:
                type: string
              description: Global patient API path, /api/v1/patients/{patientId}.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientResponse"
              examples:
                patient:
                  $ref: "#/components/examples/PatientRecord"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/doctors/{doctorId}/patients/{patientId}:
    parameters:
      - $ref: "#/components/parameters/DoctorId"
      - $ref: "#/components/parameters/PatientId"
    delete:
      tags: [Patients]
      summary: Permanently delete a patient assigned to a doctor
      operationId: deleteDoctorPatient
      description: >-
        Verifies doctor ownership, deletes the patient, and decrements the count
        in one transaction. A cross-doctor or already deleted patient returns 404.
        A failed count update aborts deletion; the count cannot become negative.
      parameters:
        - $ref: "#/components/parameters/Origin"
      responses:
        "204":
          description: Patient deleted.
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/patients:
    get:
      tags: [Patients]
      summary: List all patients
      operationId: listPatients
      description: >-
        Returns projected doctor ID/name summaries with each patient. Unknown or
        repeated query keys and unsafe pagination offsets are rejected. A valid
        nonexistent doctor filter returns an empty list. Search is a literal
        prefix; phone formatting is normalized. Counts and page data are queried
        concurrently and are not one transactional snapshot during concurrent writes.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PatientSearch"
        - name: doctorId
          in: query
          schema:
            $ref: "#/components/schemas/ObjectId"
        - $ref: "#/components/parameters/Condition"
        - $ref: "#/components/parameters/PatientStatus"
        - $ref: "#/components/parameters/CreatedFrom"
        - $ref: "#/components/parameters/CreatedTo"
        - $ref: "#/components/parameters/PatientSort"
      responses:
        "200":
          description: Paginated patients.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientListResponse"
              examples:
                patients:
                  $ref: "#/components/examples/PatientList"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /api/v1/patients/{patientId}:
    parameters:
      - $ref: "#/components/parameters/PatientId"
    get:
      tags: [Patients]
      summary: Get a patient
      operationId: getPatient
      description: Returns a public patient DTO with explicit null optional fields. Invalid IDs return 400; missing patients return PATIENT_NOT_FOUND (404).
      responses:
        "200":
          description: Patient details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientResponse"
              examples:
                patient:
                  $ref: "#/components/examples/PatientRecord"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Patients]
      summary: Update mutable patient fields
      operationId: updatePatient
      description: >-
        Merges the patch with the stored patient inside a transaction, preserving
        at least one contact method even under concurrent edits. Optional fields
        may be cleared with null; empty patches, immutable fields, and unknown
        fields return 400. Birth dates remain calendar strings; last-visit timestamps
        are normalized to UTC. The doctor association cannot change.
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePatientInput"
            example:
              status: follow_up
              notes: null
      responses:
        "200":
          description: Updated patient.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientResponse"
              examples:
                patient:
                  $ref: "#/components/examples/PatientRecord"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Patients]
      summary: Permanently delete a patient
      operationId: deletePatient
      description: Deletes the patient and decrements its doctor's count transactionally. A repeated delete returns 404. Failed count updates roll back deletion and never permit negative counts.
      parameters:
        - $ref: "#/components/parameters/Origin"
      responses:
        "204":
          description: Patient deleted.
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Get dashboard metrics and trends
      operationId: getDashboardSummary
      parameters:
        - name: from
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/CalendarDate"
          description: Inclusive local calendar date in the requested time zone. Must precede to; maximum interval is 366 calendar days.
        - name: to
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/CalendarDate"
          description: Exclusive end date in the requested time zone.
        - name: timezone
          in: query
          schema:
            type: string
            default: Asia/Dhaka
            maxLength: 100
          description: Named IANA time zone, canonicalized in the response. Numeric UTC offsets are rejected. Day boundaries follow local daylight-saving rules.
      responses:
        "200":
          description: Doctor/patient totals, average and rankings are all-time; the range applies to patientsCreatedInRange and patientsByDate only. Ranking ties use case-sensitive doctor name then ID ascending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
              examples:
                populated:
                  summary: All-time totals and a zero-filled daily trend
                  value:
                    data:
                      range: { from: "2026-01-01", to: "2026-01-04", timezone: Asia/Dhaka }
                      totals:
                        {
                          doctors: 3,
                          patients: 6,
                          patientsCreatedInRange: 4,
                          averagePatientsPerDoctor: 2,
                        }
                      patientsByDate:
                        - { date: "2026-01-01", count: 2 }
                        - { date: "2026-01-02", count: 0 }
                        - { date: "2026-01-03", count: 2 }
                      patientsByDoctor:
                        - {
                            doctorId: "507f1f77bcf86cd799439011",
                            doctorName: "Dr. Fictional A",
                            count: 4,
                          }
                        - {
                            doctorId: "507f1f77bcf86cd799439012",
                            doctorName: "Dr. Fictional B",
                            count: 2,
                          }
                        - {
                            doctorId: "507f1f77bcf86cd799439013",
                            doctorName: "Dr. Fictional C",
                            count: 0,
                          }
                empty:
                  summary: No records; zero totals and defined calendar buckets
                  value:
                    data:
                      range: { from: "2026-01-01", to: "2026-01-04", timezone: Asia/Dhaka }
                      totals:
                        {
                          doctors: 0,
                          patients: 0,
                          patientsCreatedInRange: 0,
                          averagePatientsPerDoctor: 0,
                        }
                      patientsByDate:
                        - { date: "2026-01-01", count: 0 }
                        - { date: "2026-01-02", count: 0 }
                        - { date: "2026-01-03", count: 0 }
                      patientsByDoctor: []
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: doctor_tracker_session
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
      description: Must match the configured frontend origin for unsafe browser requests.
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    CreatedFrom:
      name: createdFrom
      in: query
      schema:
        type: string
        format: date-time
      description: Inclusive creation timestamp.
    CreatedTo:
      name: createdTo
      in: query
      schema:
        type: string
        format: date-time
      description: Exclusive creation timestamp.
    DoctorId:
      name: doctorId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ObjectId"
    PatientId:
      name: patientId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ObjectId"
    PatientSearch:
      name: search
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 100
      description: Literal case-insensitive name/email/phone prefix. Phone matching removes spaces, parentheses, plus signs, dots and hyphens from both the input and stored search key.
    Condition:
      name: condition
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 120
    PatientStatus:
      name: status
      in: query
      schema:
        $ref: "#/components/schemas/PatientStatus"
    PatientSort:
      name: sort
      in: query
      schema:
        $ref: "#/components/schemas/PatientSort"
  examples:
    PatientRecord:
      summary: Fictional patient with a projected doctor summary
      value:
        data:
          id: "507f1f77bcf86cd799439012"
          doctor: { id: "507f1f77bcf86cd799439011", name: "Dr. Samira Khan" }
          name: "Fictional Samira"
          email: "samira@example.test"
          phone: null
          dateOfBirth: "2000-02-29"
          gender: null
          condition: "Routine review"
          status: active
          lastVisitAt: null
          notes: null
          createdAt: "2026-01-01T00:00:00.000Z"
          updatedAt: "2026-01-01T00:00:00.000Z"
    PatientList:
      summary: Empty first page
      value:
        data: []
        meta: { page: 1, limit: 20, total: 0, totalPages: 0 }
  schemas:
    ObjectId:
      type: string
      pattern: "^[a-f0-9]{24}$"
      examples: ["66b7a9b8e41f6f4d8c2a1091"]
    CalendarDate:
      type: string
      format: date
      examples: ["2026-11-01"]
    PaginationMeta:
      type: object
      additionalProperties: false
      required: [page, limit, total, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    Admin:
      type: object
      additionalProperties: false
      required: [id, name, email, status, lastLoginAt, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/ObjectId"
        name:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum: [active, disabled]
        lastLoginAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
    Doctor:
      type: object
      additionalProperties: false
      required:
        [id, name, specialization, hospital, phone, email, patientCount, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/ObjectId"
        name:
          type: string
        specialization:
          type: string
        hospital:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        patientCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DoctorSummary:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          $ref: "#/components/schemas/ObjectId"
        name:
          type: string
    CreateDoctorInput:
      type: object
      additionalProperties: false
      required: [name, specialization, hospital, phone, email]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        specialization:
          type: string
          minLength: 2
          maxLength: 100
        hospital:
          type: string
          minLength: 2
          maxLength: 160
        phone:
          type: string
          minLength: 7
          maxLength: 32
        email:
          type: string
          format: email
          maxLength: 254
    DoctorSort:
      type: string
      enum: ["createdAt:desc", "createdAt:asc", "name:asc", "name:desc"]
      default: "createdAt:desc"
    PatientStatus:
      type: string
      enum: [active, follow_up, discharged]
    PatientGender:
      type: string
      enum: [female, male, non_binary, prefer_not_to_say]
    Patient:
      type: object
      additionalProperties: false
      required:
        - id
        - doctor
        - name
        - email
        - phone
        - dateOfBirth
        - gender
        - condition
        - status
        - lastVisitAt
        - notes
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: "#/components/schemas/ObjectId"
        doctor:
          $ref: "#/components/schemas/DoctorSummary"
        name:
          type: string
        email:
          type: [string, "null"]
          format: email
        phone:
          type: [string, "null"]
        dateOfBirth:
          oneOf:
            - $ref: "#/components/schemas/CalendarDate"
            - type: "null"
        gender:
          oneOf:
            - $ref: "#/components/schemas/PatientGender"
            - type: "null"
        condition:
          type: string
        status:
          $ref: "#/components/schemas/PatientStatus"
        lastVisitAt:
          type: [string, "null"]
          format: date-time
        notes:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreatePatientInput:
      type: object
      additionalProperties: false
      required: [name, condition, status]
      anyOf:
        - required: [email]
        - required: [phone]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          minLength: 7
          maxLength: 32
        dateOfBirth:
          $ref: "#/components/schemas/CalendarDate"
        gender:
          $ref: "#/components/schemas/PatientGender"
        condition:
          type: string
          minLength: 2
          maxLength: 120
        status:
          $ref: "#/components/schemas/PatientStatus"
        lastVisitAt:
          type: string
          format: date-time
        notes:
          type: string
          maxLength: 1000
    UpdatePatientInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: [string, "null"]
          format: email
          maxLength: 254
        phone:
          type: [string, "null"]
          minLength: 7
          maxLength: 32
        dateOfBirth:
          oneOf:
            - $ref: "#/components/schemas/CalendarDate"
            - type: "null"
        gender:
          oneOf:
            - $ref: "#/components/schemas/PatientGender"
            - type: "null"
        condition:
          type: string
          minLength: 2
          maxLength: 120
        status:
          $ref: "#/components/schemas/PatientStatus"
        lastVisitAt:
          type: [string, "null"]
          format: date-time
        notes:
          type: [string, "null"]
          maxLength: 1000
    PatientSort:
      type: string
      description: All sorts use id in the same direction as a tiebreaker. Name uses normalized ordering. Null lastVisitAt values come first ascending and last descending.
      enum:
        - "createdAt:desc"
        - "createdAt:asc"
        - "name:asc"
        - "name:desc"
        - "lastVisitAt:desc"
        - "lastVisitAt:asc"
      default: "createdAt:desc"
    DashboardTotals:
      type: object
      additionalProperties: false
      required: [doctors, patients, patientsCreatedInRange, averagePatientsPerDoctor]
      properties:
        doctors:
          type: integer
          minimum: 0
        patients:
          type: integer
          minimum: 0
        patientsCreatedInRange:
          type: integer
          minimum: 0
        averagePatientsPerDoctor:
          type: number
          minimum: 0
          multipleOf: 0.01
    PatientsByDatePoint:
      type: object
      additionalProperties: false
      required: [date, count]
      properties:
        date:
          $ref: "#/components/schemas/CalendarDate"
        count:
          type: integer
          minimum: 0
    PatientsByDoctorPoint:
      type: object
      additionalProperties: false
      required: [doctorId, doctorName, count]
      properties:
        doctorId:
          $ref: "#/components/schemas/ObjectId"
        doctorName:
          type: string
        count:
          type: integer
          minimum: 0
    DashboardSummary:
      type: object
      additionalProperties: false
      required: [range, totals, patientsByDate, patientsByDoctor]
      properties:
        range:
          type: object
          additionalProperties: false
          required: [from, to, timezone]
          properties:
            from:
              $ref: "#/components/schemas/CalendarDate"
            to:
              $ref: "#/components/schemas/CalendarDate"
            timezone:
              type: string
        totals:
          $ref: "#/components/schemas/DashboardTotals"
        patientsByDate:
          type: array
          minItems: 1
          maxItems: 366
          items:
            $ref: "#/components/schemas/PatientsByDatePoint"
        patientsByDoctor:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/PatientsByDoctorPoint"
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      properties:
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]+$"
        message:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        requestId:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    HealthResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status:
              type: string
              enum: [ok]
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status:
              type: string
              const: ready
    AdminResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Admin"
    DoctorResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Doctor"
    DoctorListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Doctor"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    PatientResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Patient"
    PatientListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Patient"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    DashboardResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/DashboardSummary"
  responses:
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: VALIDATION_ERROR
              message: Please correct the highlighted fields.
              fieldErrors:
                email: [Enter a valid email address.]
              requestId: 9cc28c9c-191b-4312-9f63-266e6b9be37a
    InvalidCredentials:
      description: Email or password is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: INVALID_CREDENTIALS
              message: Email or password is incorrect.
              requestId: 9cc28c9c-191b-4312-9f63-266e6b9be37a
    AuthenticationRequired:
      description: A valid administrator session is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The request is not allowed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with existing state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Application is not ready.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
security:
  - sessionCookie: []
